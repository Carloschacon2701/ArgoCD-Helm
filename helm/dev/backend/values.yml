replicaCount: 1

image:
  repository: carloschacon2701/helm-test:dev-backend
  tag: dev

env:
  port: 3001
  corsOrigin: http://dev.books.local
  # Postgres runs via `docker compose up postgres -d` on the host, not in-cluster.
  # host.minikube.internal resolves to the host machine from inside minikube pods.
  dbHost: host.minikube.internal
  dbPort: 5433
  dbUsername: books
  dbName: books

secret:
  # Create before syncing:
  #   kubectl -n dev create secret generic books-backend-dev-db \
  #     --from-literal=DB_PASSWORD=<password>
  existingSecretName: books-backend-dev-db

ingress:
  enabled: true
  className: nginx
  host: api.dev.books.local
