apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: books-frontend-stg
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Carloschacon2701/ArgoCD-Helm.git
    targetRevision: main
    path: helm/core/frontend
    helm:
      releaseName: books-frontend-stg
      valueFiles:
        - ../../stg/frontend/values.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: stg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
